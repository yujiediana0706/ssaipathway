steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/pathway-frontend:latest", "."]
    dir: frontend
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/pathway-frontend:latest"]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "pathway-frontend"
      - "--image"
      - "gcr.io/$PROJECT_ID/pathway-frontend:latest"
      - "--platform"
      - "managed"
      - "--region"
      - "us-central1"
      - "--allow-unauthenticated"
      - "--port"
      - "3000"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--max-instances"
      - "10"
      - "--set-env-vars"
      - "NODE_ENV=production,GOOGLE_CLOUD_PROJECT=pathway-app-512202,GEMINI_MODEL=gemini-2.5-flash,GEMINI_LOCATION=us-central1,FROM_EMAIL=onboarding@resend.dev"
      - "--set-secrets"
      - "RESEND_API_KEY=RESEND_API_KEY:latest,GLM_API_KEY=GLM_API_KEY:latest"
    dir: frontend

images:
  - "gcr.io/$PROJECT_ID/pathway-frontend:latest"
