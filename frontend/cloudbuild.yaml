steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/pathway-frontend:$COMMIT_SHA", "."]
    dir: frontend
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/pathway-frontend:$COMMIT_SHA"]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "pathway-frontend"
      - "--image"
      - "gcr.io/$PROJECT_ID/pathway-frontend:$COMMIT_SHA"
      - "--platform"
      - "managed"
      - "--region"
      - "us-central1"
      - "--allow-unauthenticated"
      - "--port"
      - "3000"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--max-instances"
      - "10"
      - "--set-env-vars"
      - "NODE_ENV=production"
    dir: frontend

images:
  - "gcr.io/$PROJECT_ID/pathway-frontend:$COMMIT_SHA"
